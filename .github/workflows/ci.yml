name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python tests/test_ibge_client.py
      - run: python tests/test_notes.py
      - run: python tests/test_table_agent.py
      - run: python tests/test_revisions.py
      # test_indicator_analyst.py is intentionally not run here: it downloads
      # a ~280M param model, which would make every PR slow/flaky. Run it
      # locally instead (see docs/01-decisions.md).
      # test_critic.py is also local-only (loads the same NLI model).
      # test_golden_questions.py is also excluded: it needs a real
      # GROQ_API_KEY (not available in CI) and makes dozens of live LLM
      # calls. Run it locally before merging changes to the agents.
